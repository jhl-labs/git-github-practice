<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>매출 대시보드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" integrity="sha384-9nhczxUqK87bcKHh20fSQcTGD4qq5GhayNYSYWqwBkINBhOfQLg/P5HG5lF1urn4" crossorigin="anonymous" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- 로그인 화면 -->
    <main id="login-view" class="login" hidden>
      <form id="login-form" class="login-card">
        <div class="login-mark" aria-hidden="true">🔒</div>
        <h1 id="login-title">대시보드</h1>
        <p class="muted">비밀번호를 입력하세요.</p>
        <label class="sr-only" for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" required autofocus />
        <p id="login-error" class="error" role="alert" hidden>비밀번호가 올바르지 않습니다.</p>
        <button type="submit">로그인</button>
        <p class="fineprint">⚠️ 학습용 "흉내" 로그인입니다. 정적 사이트에는 진짜 인증이 없습니다.</p>
      </form>
    </main>

    <!-- 대시보드 화면 -->
    <div id="dashboard-view" hidden>
      <header class="topbar">
        <div>
          <h1 id="dash-title">대시보드</h1>
          <p id="dash-source" class="muted"></p>
        </div>
        <div class="topbar-actions">
          <select id="sheet-select" aria-label="시트 선택"></select>
          <button id="logout" type="button" class="ghost">로그아웃</button>
        </div>
      </header>
      <main class="content">
        <section id="empty" class="empty" hidden>
          <h2>아직 데이터가 없어요</h2>
          <p>저장소에서 <b>Issues → New issue → 📊 엑셀 데이터 업로드</b>로 엑셀 파일을 올리면 이곳에 표시됩니다.</p>
        </section>
        <section id="kpis" class="kpis" aria-label="핵심 지표"></section>
        <section class="panel">
          <div class="panel-head">
            <h2>그룹별 합계</h2>
            <div class="controls">
              <label>기준 <select id="group-select"></select></label>
              <label>값 <select id="value-select"></select></label>
            </div>
          </div>
          <div class="chart-box"><canvas id="chart" aria-label="그룹별 합계 차트"></canvas></div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2>원본 데이터 <span id="row-count" class="muted"></span></h2>
            <div class="panel-tools">
              <input id="search" type="search" placeholder="검색…" aria-label="표 검색" />
              <button id="csv-download" type="button" class="ghost" title="검색 결과에 보이는 행만 내려받아요">CSV 다운로드</button>
            </div>
          </div>
          <div class="table-wrap"><table id="table"></table></div>
        </section>
      </main>
    </div>
  </body>
</html>
