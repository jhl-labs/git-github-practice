name: 📊 엑셀 데이터 업로드
description: 엑셀 파일을 올리면 GitHub Actions가 대시보드 데이터로 변환합니다.
title: "[EXCEL] "
labels: ["excel-upload"]
body:
  - type: markdown
    attributes:
      value: |
        아래 칸에 **.xlsx 파일을 끌어다 놓으세요.** 이슈를 등록하면 Windows runner가 xlwings로 엑셀을 읽어
        `docs` 브랜치의 `data/data.json`을 갱신하고, 몇 분 뒤 GitHub Pages 대시보드에 반영됩니다.

        ⚠️ **공개 저장소의 이슈 첨부 파일은 누구나 내려받을 수 있습니다.** 민감한 데이터는 올리지 마세요.
  - type: textarea
    id: file
    attributes:
      label: 엑셀 파일
      description: .xlsx 파일 1개를 여기에 끌어다 놓으세요.
      placeholder: 여기에 파일을 드래그 & 드롭
    validations:
      required: true
  - type: input
    id: note
    attributes:
      label: 메모 (선택)
      placeholder: 예) 2026년 상반기 매출
