# 이슈에 첨부된 엑셀 → (Windows + xlwings) → JSON → docs 브랜치에 커밋 → GitHub Pages 배포
name: Excel → Dashboard

on:
  issues:
    types: [opened]

permissions:
  contents: write # docs 브랜치에 push
  issues: write # 결과 댓글, 이슈 닫기

# 동시에 여러 이슈가 올라와도 docs 브랜치 push가 꼬이지 않도록 한 번에 하나씩
concurrency:
  group: dashboard-data
  cancel-in-progress: false

jobs:
  # 문지기: 공개 저장소는 아무나 이슈를 열 수 있으므로, 저장소에 쓰기 권한이 있는 사람의 이슈만 통과시킨다.
  # author_association 값은 조직 멤버십을 비공개로 둔 사람이면 MEMBER가 아니라 CONTRIBUTOR로 와서
  # 관리자도 막힐 수 있다 → GitHub API로 작성자의 "실제 권한"을 확인한다. (Linux라 몇 초면 끝난다)
  gate:
    if: startsWith(github.event.issue.title, '[EXCEL]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: 이슈 작성자의 저장소 권한 확인 (write 이상만 허용)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          perm=$(gh api "repos/${REPO}/collaborators/${AUTHOR}/permission" --jq .permission 2>/dev/null || echo none)
          echo "작성자 ${AUTHOR} 의 권한: ${perm}"
          case "$perm" in
            admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT"
               echo "::notice::쓰기 권한이 없는 사용자의 이슈라 변환하지 않습니다." ;;
          esac

  convert:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # Windows runner의 파이썬 기본 출력 인코딩은 cp1252라 한글·이모지를 print 하면 UnicodeEncodeError가 난다
      PYTHONUTF8: "1"
    steps:
      - name: 코드 받기
        uses: actions/checkout@v6

      - name: Python 준비
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 이슈 첨부 엑셀 다운로드
        id: fetch
        env:
          # ⚠️ 이슈 본문은 신뢰할 수 없는 입력 → run: 안에 ${{ }}로 직접 넣지 말고 환경 변수로 전달
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_attachment.py --out input.xlsx

      - name: 엑셀 → JSON 변환 (xlwings, 실패 시 openpyxl)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FILE_NAME: ${{ steps.fetch.outputs.file_name }}
        run: python scripts/excel_to_json.py input.xlsx --out build/data.json --engine auto --issue $env:ISSUE_NUMBER --file-name "$env:FILE_NAME"

      - name: docs 브랜치에 커밋 & push
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish_docs.sh "data: 이슈 #${ISSUE_NUMBER} 엑셀 반영"

      - name: 이슈에 결과 알리고 닫기
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ 변환 완료! 이어서 Pages 배포(deploy job)가 실행되고, 끝나면 대시보드에 반영됩니다: ${PAGES_URL}
          - 실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue close "$ISSUE_NUMBER" --reason completed

      - name: 실패 알림
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ 변환에 실패했습니다. 로그를 확인해 주세요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # GITHUB_TOKEN으로 push한 커밋은 Pages 빌드를 트리거하지 않으므로, 배포 워크플로우를 직접 호출한다
  deploy:
    needs: convert
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/pages-deploy.yml
